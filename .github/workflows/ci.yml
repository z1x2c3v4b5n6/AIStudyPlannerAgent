name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      AI_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test backend
        run: bash ../scripts/ci/with-dependency-retry.sh maven mvn -B clean test
      - name: Package backend
        run: bash ../scripts/ci/with-dependency-retry.sh maven mvn -B package -DskipTests
      - name: Upload tested application
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/ai-study-planner-agent-0.0.1-SNAPSHOT.jar
          if-no-files-found: error
          retention-days: 7
      - name: Upload offline evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c12-offline-evaluation
          path: backend/target/c12-*.json
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js 20
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: bash ../scripts/ci/with-dependency-retry.sh npm npm ci
      - name: Test plan progress logic
        run: npm run test:progress
      - name: Build frontend
        run: npm run build

  workflow-e2e:
    name: Workflow E2E (MySQL, Redis, Chromium)
    runs-on: ubuntu-24.04
    needs: backend
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: agent_c8_test
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DB_URL: jdbc:mysql://localhost:3306/agent_c8_test?serverTimezone=Asia%2FShanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Download tested application
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/target
      - name: Install browser test dependencies
        working-directory: frontend
        run: bash ../scripts/ci/with-dependency-retry.sh npm npm ci
      - name: Build Vue
        working-directory: frontend
        run: npm run build
      - name: Prepare Chromium
        working-directory: frontend
        run: |
          bash ../scripts/ci/with-dependency-retry.sh npm npm install --no-save --package-lock=false playwright@1.58.2
          if command -v google-chrome >/dev/null; then
            echo "C8_CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Run authenticated business and Chromium scenarios
        run: node tests/c8-e2e.mjs
